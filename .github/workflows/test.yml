name: Witness gate

# Route 2 · Stage 0: every pull request runs the witnesses that are green today
# (`node scripts/regression.mjs ci`) in Firefox, the browser they were written for.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright and Firefox
        run: |
          npm ci
          npx playwright install --with-deps firefox
      - name: Syntax check
        run: npm run check
      - name: Serve the game at / and /black-current/
        run: |
          ln -sfn . black-current
          python3 -m http.server 8811 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:8811/black-current/ && exit 0; sleep 1; done
          cat /tmp/server.log; exit 1
      - name: Run the witness gate
        run: node scripts/regression.mjs --retry ci
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14
