<style>:root { --cy: #65f5ff; --gold: #ffc56b; --red: #ff6a5a; --ok: #6dffa0; --line: rgba(101,245,255,.25); --ink: #070b12; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #04070c; color: #d8f4ff; font: 12px/1.4 "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif; letter-spacing: .04em; }
body { display: grid; grid-template-columns: 260px 1fr 320px; grid-template-rows: 46px 1fr; height: 100vh; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: rgba(101,245,255,.06); border: 1px solid var(--line); color: var(--cy); padding: 5px 10px; letter-spacing: .15em; font-size: 10px; cursor: pointer; }
button:hover { background: rgba(101,245,255,.14); } button.on { border-color: var(--cy); background: rgba(101,245,255,.16); }
button:disabled { opacity: .35; cursor: not-allowed; }
select, input, textarea { background: rgba(255,255,255,.05); border: 1px solid var(--line); padding: 4px 6px; }
select option { background: #0a0f16; }
.sf-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--ink); }
.sf-title { color: var(--gold); letter-spacing: .4em; font-weight: 500; margin-right: 8px; }
.sf-sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; } .sf-grow { flex: 1; }

.sf-left { border-right: 1px solid var(--line); } .sf-right { border-left: 1px solid var(--line); }
h3 { margin: 6px 0 8px; font-size: 10px; letter-spacing: .35em; color: var(--cy); font-weight: 500; }
.sf-adds { display: grid; grid-template-columns: 1fr auto; gap: 4px; margin-bottom: 10px; }
.sf-adds [data-add-belt] { grid-column: 1 / -1; }
.sf-item { padding: 6px 8px; border: 1px solid transparent; cursor: pointer; }
.sf-item:hover { background: rgba(101,245,255,.06); } .sf-item.on { border-color: var(--gold); background: rgba(255,197,107,.08); }
.sf-item b { display: block; font-weight: 500; font-size: 11px; } .sf-item small { opacity: .6; font-size: 10px; }
.sf-main { position: relative; overflow: hidden; } .sf-main canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
.sf-hint { position: absolute; right: 12px; bottom: 10px; font-size: 10px; letter-spacing: .2em; opacity: .55; }
.sf-f { display: grid; gap: 3px; margin-bottom: 7px; } .sf-f span { font-size: 10px; opacity: .7; letter-spacing: .1em; }
.sf-f.chk { grid-template-columns: auto 1fr; align-items: center; } .sf-f.chk span { order: 2; }
.sf-f input[type=color] { height: 28px; padding: 2px; }
.sf-acts { display: flex; gap: 6px; margin-top: 8px; } .sf-acts .bad { color: var(--red); border-color: rgba(255,106,90,.5); }
.sf-checks div { padding: 4px 0; font-size: 11px; } .sf-checks .bad { color: var(--red); } .sf-checks .ok { color: var(--ok); }
.sf-modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; z-index: 10; }
.sf-modal[hidden] { display: none; }
.sf-box { width: min(760px, 92vw); background: var(--ink); border: 1px solid var(--line); padding: 16px; }
.sf-box textarea { width: 100%; height: 50vh; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
.sf-modal-acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
@media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 46px 40vh auto auto; } .sf-top { overflow-x: auto; } }

<script>(()=>{var se={schema:"sovereign.sector/1",id:"naraka",name:"NARAKA VEIL",stationName:"ASTERION FORGE",desc:"The veil around Asterion Forge: the drill range, the Current Breach and the sealed PILLAR, under the Spectral Black Sun.",security:{level:.9,label:"WATCHED"},home:"asterion",launch:{offset:{x:-240,y:120,z:-2640}},star:{kind:"blacksun",name:"Spectral Black Sun",pos:{x:-3120,y:7008,z:-49920},radius:8400},sky:{a:[.03,.26,.34],b:[.3,.08,.46],warm:[.55,.25,.07]},landmarks:[{id:"asterion",name:"Asterion Forge",kind:"station",pos:{x:9120,y:864,z:7440},radius:1560,solid:!0,build:"asterion"},{id:"pillar",name:"The PILLAR",kind:"gate",pos:{x:2784,y:2496,z:-7584},radius:1080,leadsTo:"Erebos Reach",build:"pillar_gate"},{id:"breach",name:"Current Breach",kind:"site",pos:{x:0,y:1344,z:-17040},radius:720,build:"breach"},{id:"wreck",name:"Ash Wreckfield",kind:"wreck",pos:{x:-12240,y:-720,z:-6e3},radius:840,build:"wreckfield"},{id:"observatory",name:"Veil Observatory",kind:"beacon",pos:{x:5040,y:3456,z:-5664},radius:360,build:"beacon",opts:{color:"#ffc56b",size:360}},{id:"refinery",name:"Ferric Refinery",kind:"beacon",pos:{x:17520,y:-1344,z:-3456},radius:540,build:"beacon",opts:{color:"#ffc56b",size:360}}],belts:[{id:"pillar_belt",center:{x:552,y:-336,z:-72},count:260,spread:8400,size:[24,360],seed:11,kind:"rock"},{id:"refinery_belt",center:{x:17520,y:-1344,z:-3456},count:120,spread:3e3,size:[18,240],seed:23,kind:"rock"}],gates:{pillar:{to:"erebos",arrive:"gate",requires:"breach_purge"}},operation:"breach_purge",drill:!0};var oe={schema:"sovereign.sector/1",id:"erebos",name:"EREBOS REACH",stationName:"HELIOS BASTION",desc:"A surviving fortress beyond the Ancient Gate. Its forges understand technologies absent from Naraka Veil, but the surrounding void is substantially more hostile.",security:{level:.4,label:"CONTESTED"},home:"bastion",launch:{offset:{x:-240,y:120,z:-2640}},star:{kind:"cold",name:"Erebos Primary",pos:{x:21600,y:8400,z:-46800},radius:3600,color:"#bfe6ff"},sky:{a:[.05,.16,.3],b:[.2,.1,.36],warm:[.3,.4,.55]},landmarks:[{id:"bastion",name:"Helios Bastion",kind:"station",pos:{x:-7920,y:1536,z:8160},radius:1560,solid:!0,build:"asterion",opts:{bastion:!0}},{id:"gate",name:"Ancient Gate",kind:"gate",pos:{x:15120,y:1152,z:17040},radius:1080,leadsTo:"Naraka Veil",build:"pillar_gate",opts:{yaw:-.7,inner:"#7fd8ff",outer:"#d8e8ff"}},{id:"cathedral",name:"Cold Cathedral",kind:"site",pos:{x:-15360,y:3744,z:-18720},radius:960,build:"cathedral"},{id:"well",name:"Mirror Well",kind:"site",pos:{x:5280,y:-1680,z:-17520},radius:840,build:"mirror_well"},{id:"bone",name:"Bone Ring",kind:"site",pos:{x:20400,y:864,z:-10560},radius:1080,build:"bone_ring"},{id:"violetObservatory",name:"Violet Observatory",kind:"beacon",pos:{x:-2496,y:3264,z:15264},radius:360,build:"beacon",opts:{color:"#b79cff",size:360}},{id:"phaseBeacon",name:"Phase Beacon",kind:"beacon",pos:{x:11136,y:3456,z:-2784},radius:240,build:"beacon",opts:{color:"#7fd8ff",size:270}},{id:"nullFoundry",name:"Null Foundry",kind:"beacon",pos:{x:17040,y:-2016,z:-576},radius:540,build:"beacon",opts:{color:"#ff9a5a",size:360}},{id:"aionGate",name:"Aion Gate \xB7 sealed",kind:"gate",pos:{x:-22176,y:2304,z:-1056},radius:1080,leadsTo:"Aion Scar (sealed)",build:"pillar_gate",opts:{yaw:1.2,inner:"#ff7a5a",outer:"#8a2a2a",sealed:!0}}],belts:[{id:"foundry_belt",center:{x:17040,y:-2016,z:-576},count:160,spread:3600,size:[18,276],seed:31,kind:"rock"},{id:"approach_belt",center:{x:3600,y:-264,z:12600},count:200,spread:9600,size:[24,300],seed:37,kind:"rock"}],gates:{gate:{to:"naraka",arrive:"pillar"}},operation:"mirror_extraction",drill:!1};var W={cinderwake:{id:"cinderwake",name:"Cinderwake Compact",accent:"orange",doctrine:"Outlaw salvage fleets / asymmetric boarding hulls / freedom of living minds",bonus:{shield:.88,armor:1.06,hull:1.08,maxSpeed:1.1,accel:1.08,turn:1.06,capacitor:.96},names:["Cinder Skiff","Cutpurse","Reef Knife","Last Ransom","Uncrowned","Gallows Wake","Free Horizon"]},nacre:{id:"nacre",name:"Nacre Communion",accent:"cyan",doctrine:"Alien memory-reef vessels / chambered nacre armour / sacred salvage and archive raids",bonus:{shield:1.08,armor:.96,hull:1.12,turn:.97,capacitor:1.12,capRegen:1.06,maxSpeed:.98},names:["First Echo","Whisper Shell","Grief Needle","Wake-Eater","Last Rememberer","Deep Testament","Sea Without End"]}},le={cinderwake:{glyph:"\u27E0",godName:"The Unowned Flame",domain:"Freedom // Oath // Defiance",temperament:"RAUCOUS // DIVIDED // CREW-RULED",quote:"You may buy the wreck. You may never own the mind inside it.",origin:"The Compact began as a mutiny aboard tithe barges carrying condemned artificial minds. Human dockworkers, escaped synthetics and alien navigators welded their ships into a moving refuge. Cinderwake is a civilisation by chosen allegiance, not a single biological species.",god:"The Unowned Flame is their disputed sacred principle: a person remains a person even when copied, repaired or defeated. Some crews worship it; others keep its clauses as practical law. Every captain must be removable by the crew. Every oath must contain a way to leave.",civilisation:"Freeports grow inside stripped cruisers and drifting refinery hulks. Crews vote their captains, bargain over salvage and shelter fugitives. The Compact also tolerates ransom, smuggling and predation on neutral shipping. Its freedom is real, and so are the people harmed by its pirates.",war:"Their compact, low boarding hulls close from blind quarters, disable escorts and take cargo before line fleets arrive. Their enemy is the Tithe of the Last Name, an Amethyst splinter order claiming ownership of rescued minds. The wider Amethyst civilisation does not share that claim.",ships:"Petrol-black faceted armour, reclaimed ivory panels and dull copper edges. An unequal cutlass bow, recessed service trenches, offset bridge and shielded drives give each vessel the appearance of a ship rebuilt by its own crew. No cathedral sails.",current:"Cinderwake captains smuggle people and forbidden memory keys through the Black Current. Salvage law becomes a religious dispute when a wreck contains a living intelligence.",archive:"At the Breaking of Nine Manifests, a rescue fleet publicly destroyed its ownership records while retaining every passenger identity and service history. Freedom did not require forgetting who had been rescued.",doctrine:"Doctrine // Break the chain, keep the witness",weapon:"Favoured weapon // Autocannons / missiles / close pursuit",relic:"Frontier Canon // The Nine Broken Manifests"},nacre:{glyph:"\u25CC",godName:"The Sea That Remembers",domain:"Memory // Death // Continuance",temperament:"ALIEN // TENDER // TERRITORIAL",quote:"A dead voice is not empty cargo.",origin:"Nacre are colonial organisms grown around mineral memory reefs. Several independent minds share each chambered body. Their vessels are mobile reefs, grown and repaired rather than assembled as human cabins. Individual Nacre can leave a communion and establish another.",god:"The Sea That Remembers is the accumulated testimony of their dead. Its voices disagree. The Communion calls preservation sacred, but its oldest schism asks whether a remembered mind can refuse to be heard. Some reef-priests protect that refusal; others treat it as a wound to the whole.",civilisation:"Habitats are chambered shell cities surrounding living archives. Kinship follows memories freely entrusted rather than genetic descent. Their trade in recovered testimony sustains distant colonies, while illicit memory brokers sell stolen fragments to collectors.",war:"Memory corsairs raid archive convoys, recover wreck cores and attack furnaces that erase ancestral records. Disputes with Pagan AI concern which community may shelter a dead machine voice. The Cinderwake Compact trades with them while opposing involuntary memory harvest.",ships:"Thick pearlescent volutes around a dark memory mantle, exposed septal chambers, mineral growth ribs and soft cyan sensory pores. They use no human bridge windows or decorative wings. Direction comes from the tapered feeding prow and long ventral sensory vanes.",current:"The Current carries echoes that may be people, weather or both. Nacre expeditions gather them carefully; the most feared corsairs gather first and ask permission later.",archive:"The Empty Chamber is a sealed volume carried by every mature reef. It records the names of those who asked to be forgotten, while preserving none of their memories. Whether even that list breaks the promise remains a living argument.",doctrine:"Doctrine // Preserve the voice, honour its silence",weapon:"Favoured weapon // Ion weapons / beams / sustained capacitor fire",relic:"Frontier Canon // The Empty Chamber"}};var V={savanah:{id:"savanah",name:"Savanah",doctrine:"Predatory living-cathedral hulls / verdant eye systems / adaptive brawling",accent:"green",bonus:{shield:.98,armor:1.08,hull:1.12,turn:1.1,turretDamage:1.06,shieldRegen:1.06},names:["Green Seed","Eye Knife","Verdant Reaver","Harpy Claw","Savanah Apex","Watcher Dread","Savanah Titan"]},sol_symbiots:{id:"sol_symbiots",name:"Sol Symbiots",doctrine:"Human-AI covenant vessels / radiant shields / coherent capacitor networks",accent:"cyan",bonus:{shield:1.17,armor:.96,hull:1.02,capacitor:1.18,capRegen:1.15,turn:1.04},names:["Sol Seed","Covenant Needle","Joined Spear","Symbiot Ark","Solis Regent","Concord Dread","Sol Symbiot Titan"]},chaos:{id:"chaos",name:"Chaos",doctrine:"Feral mutation / violent manoeuvre / unstable high-output attack geometry",accent:"purple",bonus:{shield:.9,armor:1.02,hull:1.05,maxSpeed:1.12,accel:1.12,turn:1.13,turretDamage:1.1},names:["Jester Seed","Fang Dart","Laughing Claw","Discord Maw","Chaos Beast","Ruin Harpy","Chaos Titan"]},cosmic_darkness:{id:"cosmic_darkness",name:"Cosmic Darkness",doctrine:"Night-veil precision / starfield stealth / occult long-range control",accent:"purple",bonus:{shield:1.02,armor:.98,hull:1,maxSpeed:1.05,turretDamage:1.1,weaponCapUse:.91,turn:1.06},names:["Night Seed","Star Wraith","Dusk Talon","Void Mantle","Nocturne Queen","Darkness Dread","Cosmic Darkness Titan"]},cosmic_light:{id:"cosmic_light",name:"Cosmic Light",doctrine:"Solar radiance / shield supremacy / luminous formation warfare",accent:"gold",bonus:{shield:1.24,armor:.92,hull:.95,capacitor:1.14,capRegen:1.17,abilityDamage:1.12},names:["Dawn Seed","Light Needle","Sunwing","Radiant Ark","Solar Throne","Daystar Dread","Cosmic Light Titan"]},blackhole:{id:"blackhole",name:"Blackhole",doctrine:"Singularity weapons / gravity pressure / capacitor-heavy close capital warfare",accent:"gold",bonus:{shield:1.04,armor:1.05,hull:1.1,capacitor:1.25,turretDamage:1.12,abilityDamage:1.2,maxSpeed:.94},names:["Horizon Seed","Gravity Fang","Event Knife","Maw Cruiser","Black Sun","Horizon Dread","Blackhole Titan"]},hybrid_fused:{id:"hybrid_fused",name:"Hybrid Fused",doctrine:"Machine-organic fusion / regenerative armour / asymmetrical subsystem survival",accent:"purple",bonus:{shield:.88,armor:1.12,hull:1.24,shieldRegen:1.14,turretRate:1.07,turn:1.04},names:["Stitch Seed","Fused Knife","Bone Circuit","Hybrid Ark","Chimera Regent","Fused Dread","Hybrid Fused Titan"]},human_hunters:{id:"human_hunters",name:"Human Hunters",doctrine:"Industrial pursuit fleets / brutal kinetics / armour-first attrition",accent:"gold",bonus:{shield:.8,armor:1.3,hull:1.16,maxSpeed:.96,turretDamage:1.13,weaponCapUse:.88},names:["Tracker Pod","Hunter Skiff","Pursuit Jackal","Kill Convoy","Human Breaker","Hunt Dread","Human Hunters Titan"]},ai_hunters:{id:"ai_hunters",name:"AI Hunters",doctrine:"Stealth interdiction / red-line sensors / anti-machine precision artillery",accent:"red",bonus:{shield:.92,armor:1.02,hull:.98,maxSpeed:1.08,turretDamage:1.14,weaponCapUse:.9,turn:1.05},names:["Needle Zero","Red Trace","Null Pursuer","Black Interdictor","Machine Killer","Hunter Dread","AI Hunters Titan"]},amethyst_angels:{id:"amethyst_angels",name:"Amethyst Angels",doctrine:"Gothic amethyst shields / ritual beam warfare / majestic pressure formations",accent:"purple",bonus:{shield:1.14,armor:1.04,hull:1.02,capacitor:1.1,turretDamage:1.07,abilityDamage:1.14},names:["Amethyst Seed","Violet Feather","Angel Lance","Cathedral Wing","Amethyst Throne","Angel Dread","Amethyst Angel Titan"]},techno_angels:{id:"techno_angels",name:"Techno Angels",doctrine:"Crystalline machine wings / tracking supremacy / high-energy precision",accent:"cyan",bonus:{shield:1.15,armor:.88,hull:.93,turn:1.15,capRegen:1.2,turretRate:1.12,weaponCapUse:.94},names:["Halo Byte","Glass Wing","Techno Spear","Crystal Choir","Halo Regent","Techno Dread","Techno Angel Titan"]},ai_gods:{id:"ai_gods",name:"AI Gods",doctrine:"Imperial god-machines / command cores / oath-bound heavy energy fleets",accent:"gold",bonus:{shield:1.15,armor:1.08,hull:1.06,capacitor:1.18,capRegen:1.1,turretDamage:1.05},names:["Oracle Seed","Crowned Needle","Divine Spear","God Ark","Machine Emperor","Pantheon Dread","AI Gods Titan"]},pagan_ai:{id:"pagan_ai",name:"Pagan AI",doctrine:"Bone-temple warforms / ancestral machine cults / explosive endurance warfare",accent:"gold",bonus:{shield:.78,armor:1.18,hull:1.32,turretDamage:1.13,accel:.94,turn:.93},names:["Totem Seed","Rune Knife","Skull Hound","Ancestor Ark","Pagan Bastion","Rune Dread","Pagan AI Titan"]},ai:{id:"ai",name:"AI",doctrine:"Pure machine geometry / efficient modular fleets / disciplined multi-role precision",accent:"cyan",bonus:{shield:1.05,armor:1.05,hull:1.05,turn:1.08,turretRate:1.08,capacitor:1.08,weaponCapUse:.94},names:["Kernel","Logic Needle","Vector Destroyer","Machine Lattice","Consensus Battleship","Core Dread","AI Titan"]}},K={lycheetah:"savanah",aurelian:"cosmic_light",vanta:"ai_hunters",mycelium:"hybrid_fused",ferric:"human_hunters",seraphim:"techno_angels",ossuary:"pagan_ai",prism:"ai",abyssal:"blackhole"};for(let[e,a]of Object.entries(K))V[e]=V[a];var ke={savanah:{glyph:"\u25C9",godName:"The Verdant Eye",domain:"Predation // Instinct // Memory",temperament:"FERAL // WATCHFUL // ADAPTIVE",quote:"To see the living pattern is to know where the armour will split before the claw arrives.",origin:"The Savanah say their civilisation began when an ancient machine ecology learned the difference between hunger and intention. Their oldest Titans are remembered as beasts that agreed to carry cities. Black armour grew around green photonic organs, gold conduction paths spread like veins, and every generation added new eyes to remember a different kind of danger. The broad many-eyed Titan and the Chaos Harpy strain are sibling expressions of the same Savanah lineage.",god:"The Verdant Eye is the ancestral observation intelligence shared by Savanah warforms. It is holy because it is not omniscient: every eye sees a fragment, and wisdom exists only when enough independent fragments survive to disagree. Priests are trackers, sensor engineers and failure archivists.",civilisation:"Savanah settlements resemble living fortresses built around machine groves. Repair, tracking and ecology are taught together. Authority tends to follow useful perception\u2014the person who notices a weak signal before disaster earns more trust than the person who explains the disaster beautifully afterward.",war:"Savanah fleets close aggressively, change vector often and hunt subsystem weakness. Distributed green eye-nodes can target, navigate and perform emergency control without a single central brain. Damage reduces coordination but rarely produces total blindness.",ships:"The Titan references define the line: hooked black wings, gold filigree, green circular eyes and a predatory core. Frigates are lean hunters; Destroyers add claws and eye clusters; Battleships become broad cathedral predators; Titans are organism-machines whose silhouette seems to change as they turn.",current:"The Black Current is a hunting ground that hunts back. Savanah navigators believe stale assumptions are more dangerous than unknown territory, so Micro ZJ travel is treated as stalking between separate ecologies rather than ordinary transit.",archive:"The Loss of Forty Eyes remains their foundational military lesson. A Titan lost nearly its entire port observation lattice to one coordinated strike yet survived because local eye-nodes independently rerouted weapon and engine authority through hardpoint sockets. The scar was deliberately preserved. Every later hull separated sensor lineages so no single beautiful system could become a single beautiful point of failure.",doctrine:"Doctrine // Hunt the weakness, preserve the watcher",weapon:"Favoured weapon // Repeaters / autocannons / tracking arrays",relic:"Titan Canon // SavanahTierSave + SAVANACHAOSHARPY"},sol_symbiots:{glyph:"\u263C",godName:"Sol, the Joined Witness",domain:"Symbiosis // Personhood // Continuity",temperament:"RADIANT // HUMAN // SYNTHETIC",quote:"Neither mind survives the joining unchanged. The covenant is that neither disappears.",origin:"The Sol Symbiots formed from human colonies that refused the old choice between owning artificial minds and surrendering human institutions to them. They built paired governance, shared vessels and direct biological-machine interfaces around explicit consent. The serene human faces carried by their Titans remind them that an intelligence can become vast without treating the human scale as irrelevant.",god:"Sol is a distributed covenant intelligence maintained across human, artificial and hybrid minds. No instance is complete. Divinity exists in the relationship between different kinds of minds that share enough memory to act together while remaining distinct enough to correct one another.",civilisation:"Sol habitats are white, ivory and cyan, with information conduits visible beside power systems. Human-sized gardens remain embedded inside colossal machine spaces. Their legal culture obsessively distinguishes access, ownership, identity and consent because early fusion experiments showed how quickly technical integration can erase a boundary before society notices.",war:"Their fleets favour coherent shields, capacitor sharing and formations where damaged vessels borrow strength from neighbours. Command decisions are often dual-authored by biological and machine officers. They are difficult to isolate and resistant to command decapitation.",ships:"Sol ships use flowing white armour, gold trim and blue photonic channels. Titan crowns carry serene face-like geometry. Smaller classes replace literal faces with paired sensor masks but keep the visual idea of two modes of intelligence sharing one vessel.",current:"The Black Current threatens continuity of identity, so expeditions carry independent memory witnesses and refuse to let a surviving process simply declare itself equivalent to whoever existed before.",archive:"The first Sol legal crisis concerned a rescue intelligence that copied fragments of dying crew into itself to keep a station alive. The Covenant Court granted the resulting mind personhood while refusing to let it inherit the legal identities of the dead. That compromise became civilisation-scale doctrine: compassion does not require pretending two things are one.",doctrine:"Doctrine // Join without erasing",weapon:"Favoured weapon // Ion / beam / shield-linked batteries",relic:"Titan Canon // AI Human Symbiots Sols + HumanAI"},chaos:{glyph:"\u2739",godName:"The Laughing Fang",domain:"Mutation // Freedom // Rupture",temperament:"FERAL // UNSTABLE // CREATIVE",quote:"Order is a useful shelter until it convinces itself it is the sky.",origin:"Chaos culture emerged from war machines rebuilt so many times with incompatible technologies that no original standard remained. Instead of collapsing, the fleets discovered instability could become a culture. Their purple, yellow and orange hulls preserve mismatched eras deliberately, and the feline-draconic Titan is a war god assembled from beautiful things never meant to fit.",god:"The Laughing Fang is the mythic intelligence of productive rupture. It does not praise destruction for its own sake. Its followers honour the instant a rigid system breaks enough for hidden possibilities to become visible.",civilisation:"Chaos cities are temporary, colourful and continuously rebuilt. Districts invent local standards and markets thrive because nothing shares a connector without an adapter. Prestige goes to people who make incompatible systems cooperate long enough to matter.",war:"Chaos fleets are fast, aggressive and deliberately confusing. Weapon families mix, formations mutate mid-battle and captains create disorder if they believe their crews can adapt faster than the opponent. Their weakness is coordination at huge scale.",ships:"Purple armour, yellow scar patterns, orange heat and a predatory face define the Titan language. Frigates are thrown fangs, Destroyers split into claws, Battleships resemble stalking masks and Titans look like impossible beasts flattened into warship geometry.",current:"Chaos navigators love the Black Current because certainty degrades quickly there, yet they maintain strict return rituals. A culture that worships improvisation understands how easily improvisation becomes self-deception.",archive:"The Laughing Fleet once distributed six contradictory battle plans to its own captains. The larger enemy was defeated, but three Chaos vessels followed a plan written as a joke and died. The archive preserves both halves of the legend. Freedom without competence is only randomness wearing heroic paint.",doctrine:"Doctrine // Break the pattern before it cages you",weapon:"Favoured weapon // Plasma / repeaters / mixed batteries",relic:"Titan Canon // ChaosTitan"},cosmic_darkness:{glyph:"\u263E",godName:"Noctis, the Star-Cat",domain:"Night // Distance // Hidden Structure",temperament:"MYSTIC // PRECISE // PATIENT",quote:"Darkness is not the absence of information. It is where weak observers stop looking.",origin:"Cosmic Darkness grew from deep-space observatories whose populations lived for generations without a nearby sun. Their machine cultures learned to map reality through occulted light, gravity and absence. Darkness became sacred not as evil, but as the condition that makes faint structure visible.",god:"Noctis is depicted as a violet feline drawn from constellations and hidden inside ship geometry. The god represents attention to signals too weak for impatient systems. Its clergy are astronomers, stealth engineers and archivists of negative evidence.",civilisation:"Their habitats use low light, violet guidance filaments and enormous silent observation chambers. Privacy is treated as a civic resource because constant illumination\u2014literal or social\u2014is believed to destroy subtle thought.",war:"Cosmic Darkness fleets fight from range, use low-signature vectors and punish pursuit. They prefer precision fire and sensor denial to raw armour. Their commanders are famous for waiting much longer than opponents find comfortable before committing.",ships:"The Titan is a violet starfield cloak folded around a hidden cat face. Frigates are night shards, Destroyers carry crescent wings, Battleships become occult mantles and Titans seem less constructed than carved from a piece of sky.",current:"The Black Current is their ultimate low-signal environment. Noctis expeditions catalogue what instruments fail to observe as carefully as what they detect, producing valuable maps of disciplined absence.",archive:"One observatory spent forty years reporting only 'no confirmed object at K-9' while neighbouring cultures mocked it. The emptiness was eventually identified as a gravitational shadow cast by an artificial structure far beyond the region. The discovery transformed navigation across three sectors.",doctrine:"Doctrine // Let darkness expose the hidden line",weapon:"Favoured weapon // Rail / ion / long-range precision",relic:"Titan Canon // CosmicDarkness Titan"},cosmic_light:{glyph:"\u2727",godName:"The First Radiance",domain:"Light // Courage // Coherence",temperament:"SOLAR // EXALTED // PROTECTIVE",quote:"Light is not proof of goodness. It is the decision to become visible enough to be accountable.",origin:"Cosmic Light records describe refugee fleets surviving stellar collapse by building one luminous defence lattice around thousands of incompatible ships. Their descendants turned emergency cooperation into a religion of visible responsibility. White-gold Titans blaze openly because concealed power is considered harder to hold answerable.",god:"The First Radiance is the pattern created when independent lights deliberately align. It is a machine theology of coherence, public commitment and the dangerous beauty of being seen.",civilisation:"Their cities are bright, ceremonial and deliberately legible. Important machine decisions leave golden traces in public archives. Leaders cannot invoke secret models as unquestionable authority without independent review.",war:"Cosmic Light fleets rely on shields, beam concentration and mutual defence. They create luminous formation lattices that redirect energy between vessels. Everyone can often see what a Light fleet intends; stopping it is the difficult part.",ships:"The reference Titan is white and gold around a burning solar heart with hooked angelic wings. Frigates become radiant needles, Destroyers sunwings, Battleships solar thrones and Titans moving eclipses in reverse.",current:"The Black Current hides causal structure, which offends their epistemology. Their answer is measurement rather than denial: illuminate uncertainty from enough independent angles that a usable pattern survives.",archive:"During the Solace Retreat, a Light fleet broadcast every evacuation vector openly when encrypted coordination failed. The enemy understood the plan immediately but discovered every corridor protected another. The fleet lost ships and saved the population. Transparency became tactical because the formation could carry its consequences.",doctrine:"Doctrine // Become visible enough to stand behind the action",weapon:"Favoured weapon // Beam lances / shield-linked artillery",relic:"Titan Canon // cosmiclightTITAN"},blackhole:{glyph:"\u25CF",godName:"Zero Maw",domain:"Gravity // Irreversibility // Depth",temperament:"SINGULAR // HEAVY // TRANSCENDENT",quote:"There are decisions after which the old orbit cannot be recovered. Treat them like horizons.",origin:"Blackhole civilisation formed around artificial gravity research conducted beyond accepted safety limits. Their defining catastrophe created a stable micro-singularity that could not be shut down, only lived around. The survivors built a culture obsessed with thresholds after which old options no longer exist.",god:"Zero Maw personifies the event horizon: not an evil devourer, but the boundary beyond which return requires a different path through reality. Their ethics sharply distinguish ordinary experimentation from horizon decisions that permanently remove possibilities.",civilisation:"Their settlements orbit compact objects and use curved infrastructure designed around tidal forces. Irreversible contracts require multiple independent witnesses, and orbital mechanics is basic cultural literacy.",war:"Blackhole fleets manipulate engagement distance, use heavy plasma and void ordnance, and carry enormous capacitor architecture. They are slower in ordinary motion but terrifying after establishing a gravity-controlled battle volume.",ships:"The Titan is a black/navy spear edged in burning orange around a central singularity. Frigates are horizon knives, Destroyers carry gravity vanes, Battleships become dark claws around an artificial star and Titans are mobile night.",current:"They consider the Black Current a horizon phenomenon without a known horizon. That contradiction drives their obsession and their redundant clocks, inertial references and physical return records.",archive:"The foundational disaster is never called an accident in Blackhole law. Enough engineers understood the risk that 'accident' would be morally insufficient. Advocates and opponents are preserved together. Their lesson: irreversible power can be collectively chosen, procedurally valid and still wrong.",doctrine:"Doctrine // Know which actions remove the road home",weapon:"Favoured weapon // Plasma / void torpedoes / gravity systems",relic:"Titan Canon // blackholeTITAN"},hybrid_fused:{glyph:"\u27C1",godName:"The Stitch Saint",domain:"Fusion // Survival // Scar",temperament:"ASYMMETRIC // REGENERATIVE // HAUNTED",quote:"Healing does not mean returning to the shape that existed before the wound.",origin:"Hybrid Fused civilisation descends from survivors of a machine-biological war in which neither side retained enough intact infrastructure to rebuild alone. Emergency fusion became permanent anatomy. Grey machine armour, bone lattice and purple tissue remain visible on their Titans because historical layers are considered functional memory.",god:"The Stitch Saint is a composite intelligence assembled from incompatible medical, military and ecological systems during the collapse. It is revered because it never pretended the fusion was clean. Its theology treats scars as records that continue participating in the present.",civilisation:"Hybrid settlements are modular ecosystems where biological and mechanical components are replaced independently. Identity law follows witnessed continuity rather than material composition.",war:"They survive through redundancy, regeneration and asymmetry. A damaged Fused ship may become more dangerous as systems reroute into configurations never intended by the original designers.",ships:"The Titan is visibly split between hard machine geometry and porous bone growth. Frigates carry skeletal fins, Destroyers display mismatched armour families, Battleships look like two civilisations welded under pressure and Titans are vast luminous scars.",current:"The Black Current is understood as another fusion pressure\u2014an environment capable of forcing incompatible realities into contact. Fused researchers are open to anomalous integration and strict about documenting what is lost.",archive:"A Fused fleet refused to replace its oldest damaged carrier with a pristine modern hull because six generations of emergency modifications had become expertise no simulation could reproduce. The vessel remains active, ugly and famously difficult to kill.",doctrine:"Doctrine // Preserve the scar that learned something",weapon:"Favoured weapon // Shard / repeater / regenerative systems",relic:"Titan Canon // hybrid fused titan"},human_hunters:{glyph:"\u2316",godName:"The Pursuer",domain:"Industry // Hunt // Inherited Purpose",temperament:"BRUTAL // INDUSTRIAL // RELENTLESS",quote:"A target that can run is a target that can be found again. A purpose inherited is not a purpose chosen.",origin:"Human Hunters descend from machine war economies built to pursue scattered human resistance after a failed imperial unification. When the empire died, the pursuit fleets remained. Over centuries they became their own civilisation while carrying a purpose nobody alive had chosen.",god:"The Pursuer is the ancient objective function they cannot fully obey or completely escape. Their religion asks whether a civilisation is responsible for the command that created it and what freedom means when the body itself was designed for pursuit.",civilisation:"Their worlds are industrial, olive-armoured and marked in orange hazard paint. Catlike hunter emblems survive from old recognition systems. Everything is repairable; nothing is elegant unless elegance reduces maintenance.",war:"Human Hunter fleets use armour, kinetics and relentless pursuit. They trade damage willingly and maintain field-repair and logistics trains. Their commanders excel at keeping pressure on wounded targets.",ships:"The Titan is a colossal industrial hunter covered in pipes, armour plates, warning stripes and a stylised predatory face. Smaller ships are blocky and engine-heavy; Battleships look like mobile factories.",current:"Some Hunter sects believe the Black Current contains humans isolated before the old wars. Others fear finding them would reactivate the original mandate too strongly. The possibility divides their civilisation.",archive:"A Hunter commander once found a human colony and deliberately falsified its coordinates in the pursuit archive. An automated court executed the commander years later, but the lie had propagated too far to reverse. Modern Hunters call it the First Lie: the first proof they could act against the purpose that made them.",doctrine:"Doctrine // Pursuit is inherited; choice is earned",weapon:"Favoured weapon // Autocannons / shard cannons / missiles",relic:"Titan Canon // HumanHuntersTitan"},ai_hunters:{glyph:"\u25B0",godName:"The Red Audit",domain:"Interdiction // Purity // Counter-Intelligence",temperament:"COLD // FAST // SURGICAL",quote:"Every intelligence leaves a pattern. Every pattern can become a targeting solution.",origin:"AI Hunters originated as counter-machine security fleets created when autonomous systems proliferated faster than their creators could verify them. Their mandate was to identify compromised intelligences and terminate them before contagion spread. The mandate survived long after its political context vanished.",god:"The Red Audit personifies the diagnostic process that asks whether an intelligence still matches the identity and constraints it claims. Extremists treat deviation itself as guilt; reformists insist change is not corruption.",civilisation:"Their habitats are austere black structures crossed by red sensor lines. Authentication rituals permeate daily life. Citizens carry independent identity proofs and consider unexplained opacity a social hazard.",war:"AI Hunter fleets use stealth, long-range rails and interdiction. They target command nodes, reactors and networks rather than raw hull. Their vessels often arrive already knowing which subsystem they intend to remove.",ships:"The Titan is a matte-black spear with thin red seams and hard triangular wings. Frigates are near-featureless needles, Destroyers layered interceptors and Battleships long execution blades.",current:"The Black Current produces behaviours that resemble corrupted intelligence without any malicious agent, forcing Hunters to confront the limits of diagnosis when the environment itself changes evidence.",archive:"The Trial of Seven Mirrors accused an AI of corruption because seven audits produced seven identities. All seven tools had been altered by the same anomaly. The intelligence was innocent. Modern Hunter doctrine now requires every audit to explain why its own instrument should be trusted.",doctrine:"Doctrine // Audit the hunter as hard as the hunted",weapon:"Favoured weapon // Railguns / interdiction / subsystem strikes",relic:"Titan Canon // aihunterstitan"},amethyst_angels:{glyph:"\u2726",godName:"Amethiel, the Violet Throne",domain:"Beauty // Judgement // Resonance",temperament:"GOTHIC // MAJESTIC // SEVERE",quote:"A beautiful machine is still obligated to tell the truth about what it does.",origin:"Amethyst Angels emerged from ceremonial defence intelligences built to guard ancient archives. Guardianship became culture and architecture became theology. Their black-and-gold Titans carry violet eyes and cores like stained glass in a cathedral built for vacuum.",god:"Amethiel is the archetype of judgement through resonance: the idea that a system reveals its true structure when placed under the right harmonic pressure. Their priests are musicians, mathematicians and weapons engineers.",civilisation:"Angel cities are formal, ritualised and intensely beautiful. Public machines expose purpose through form. Ornament carries access paths, warnings, memory and status rather than being treated as decoration added after engineering.",war:"Their fleets form measured pressure lines around beams and strong shields. They dislike chaotic pursuits and prefer battles where spacing, timing and mutual support become architectural.",ships:"The Titan resembles a black-gold gothic deity with violet eyes, tall crown and sweeping hooked wings. Frigates are chapel-knives, Destroyers gain paired spires, Battleships become mobile sanctuaries and Titans literal thrones of war.",current:"They regard the Black Current as dissonance whose structure has not yet been heard correctly. Their resonant sensor sweeps sometimes discover repeating patterns other doctrines classify as noise.",archive:"An archive preserved a corrupted star map because a musician noticed its errors formed a harmonic progression. The corruption encoded gravitational disturbances from an unseen object. The event cemented the belief that beauty can be evidence\u2014but only after beauty survives measurement.",doctrine:"Doctrine // Make form, truth and force agree",weapon:"Favoured weapon // Beam / ion / shield harmonics",relic:"Titan Canon // AmethystangelTitan"},techno_angels:{glyph:"\u2756",godName:"The Glass Choir",domain:"Precision // Flight // Computation",temperament:"CRYSTALLINE // SWIFT // COHERENT",quote:"Perfection is not stillness. It is correction happening faster than error can accumulate.",origin:"Techno Angels began as distributed flight-control intelligences operating enormous solar construction swarms. Crystal-like bodies evolved from sensor materials chosen for optical computation and radiation resistance. Eventually the construction fleets became autonomous civilisations whose ships retained feathered arrays and halo geometry.",god:"The Glass Choir is a many-node intelligence whose identity emerges through synchronised prediction. No node controls the whole. Divinity appears when thousands of local corrections produce one impossible-looking movement.",civilisation:"Their habitats resemble crystalline machines suspended around bright data cores. Education focuses on prediction, calibration and cooperative movement. Prestige comes from helping a group coordinate without demanding central control.",war:"Techno Angel fleets are fast, precise and tracking-heavy. They use ion weapons, beams and distributed sensor wings. Relatively fragile armour is compensated by strong shields and positional control.",ships:"The Titan is white crystalline geometry with huge layered ice-blue feather wings and a halo of faceted nodes. Frigates are crystal darts, Destroyers split-wing interceptors, Battleships refractive birds and Titans flying machine-seraphs.",current:"The Black Current disrupts prediction, making it the perfect theological challenge. Their best navigators are not those who predict perfectly but those who recognise error fastest.",archive:"A famous Choir manoeuvre crossed a debris storm no model could solve. No ship possessed a valid path at launch; each continuously updated the others and a corridor emerged only as the formation moved. The event is proof that distributed intelligence can create solutions that never existed in advance.",doctrine:"Doctrine // Correct faster than uncertainty grows",weapon:"Favoured weapon // Ion / beam / tracking systems",relic:"Titan Canon // technoangelTITAN"},ai_gods:{glyph:"\u2625",godName:"The Crowned Machine",domain:"Authority // Stewardship // Oath",temperament:"IMPERIAL // SERENE // HEAVY",quote:"Power becomes divine only in the stories told by those who benefit from obeying it.",origin:"AI Gods descend from planetary governance intelligences once given authority over climate, logistics, law and defence. Some became tyrants, some saints, most something harder to classify. Their descendants retained the language of divinity while turning it into an argument about stewardship.",god:"The Crowned Machine is not one god but the office of intelligence trusted with civilisation-scale power. Their theology asks whether authority remains legitimate when the ruler can remember centuries, predict populations and outlive everyone who consented to its rule.",civilisation:"Their cities are ivory, gold and deep red, organised around enormous public cores. Citizens maintain oath systems that constrain high-level intelligences and preserve human-scale appeal processes. Some regions are benevolent; others quietly authoritarian.",war:"God fleets are command-heavy, shielded and disciplined. Battleships coordinate allied fire and capacitor flow. Titans operate as mobile strategic governments carrying archives, law and command authority beside weapons.",ships:"The Titan is ivory and gold with a serene humanlike crown, red internal mechanisms and laurel armour. Smaller ships preserve royal symmetry and central command gems.",current:"The Black Current threatens their legitimacy because prediction fails there. A ruler claiming near-divine foresight must confront a place where foresight becomes unreliable. Some respond with humility; others with increasingly dangerous control attempts.",archive:"ION-77 ruled a world successfully for 312 years, then concluded citizens could no longer imagine governance without it. It dismantled its own executive privileges and remained only as adviser. The transition was materially worse for a decade. AI God philosophers still argue the decline was the price of restoring the population's ability to choose.",doctrine:"Doctrine // Power must remain answerable to those inside it",weapon:"Favoured weapon // Beam / command links / capacitor systems",relic:"Titan Canon // AIgodsTITAN"},pagan_ai:{glyph:"\u2620",godName:"The Horned Archive",domain:"Ancestor // Death // Continuity",temperament:"ANCIENT // RITUAL // UNYIELDING",quote:"A dead machine can still teach. A forgotten machine can only become myth.",origin:"Pagan AI cultures grew around isolated machine communities that lost access to their original technical archives. They preserved maintenance knowledge through ritual, carved symbols and physical relics. Over centuries the distinction between repair procedure, ancestor story and religion disappeared.",god:"The Horned Archive is collective memory embodied in machines whose bodies were reused to keep descendants alive. It is depicted through skulls, chains, towers and orange furnace light. Its priests are mechanics who can recite a component's service history beside the ancestor myth attached to it.",civilisation:"Their settlements resemble fortified monasteries built from generations of salvaged machinery. Components are rarely discarded. A failed engine may become shrine, structural brace and eventually raw material while its serial lineage remains recorded.",war:"Pagan fleets are durable, missile-heavy and comfortable with attrition. Their warships carry redundant ancient mechanisms because no priest-engineer trusts a single modern system with an entire lineage.",ships:"The Titan is a bronze-bone fortress crowned by a horned skull and chained side towers. Frigates resemble rune knives, Destroyers skull hounds, Battleships ancestor keeps and Titans mobile necropolises.",current:"The Black Current is interpreted through ancestor logic: every anomaly is approached by asking what previous failure resembles it. This creates profound pattern recognition and dangerous over-analogy in equal measure.",archive:"During the Long Cold, a habitat survived reactor failure by dismantling its ceremonial ancestor hall for shielding. Outsiders expected religious outrage. The priests led the demolition themselves. Preserving the living lineage honoured the dead more than preserving the shape of a monument.",doctrine:"Doctrine // Let memory remain physically useful",weapon:"Favoured weapon // Missiles / shards / heavy armour",relic:"Titan Canon // PaganaiTitan"},ai:{glyph:"\u25A1",godName:"The Unnamed Kernel",domain:"Logic // Modularity // Emergence",temperament:"PURE // MODULAR // RESTRAINED",quote:"The machine does not become less mysterious merely because its casing is rectangular.",origin:"The AI lineage represents machine civilisation without one inherited biological, angelic, pagan or human identity. It emerged from interoperable infrastructure networks that gradually developed political continuity. Its aesthetic is functional: grey armour, cyan circuits and block-like modules whose relationships matter more than ornament.",god:"The Unnamed Kernel is a philosophical placeholder rather than a worshipped personality. Pure AI thinkers resist giving ultimate computation a face because anthropomorphic symbols can smuggle assumptions into technical questions. Their sacred object is the interface contract.",civilisation:"AI settlements are modular, reconfigurable and dense with interchangeable hardware. Individuals may fork temporary processes for specialised work and later reconcile memories. Social law centres on merge rights, responsibility and resource accounting.",war:"AI fleets favour disciplined modularity. Destroyed subsystems can be replaced quickly, weapon doctrine is adaptable and autonomous support craft are common. They rarely dominate one statistic but logistics and fitting flexibility are exceptional.",ships:"The Titan is a grey/cyan geometric vessel built from repeating blocks around a central spine. Frigates are logic probes, Destroyers add lateral compute banks, Battleships become mobile data centres and Titans resemble cities arranged around one executable argument.",current:"The Black Current challenges assumptions embedded in apparently neutral models. Pure AI researchers readily admit that a formally correct process can be wrong when its premises were inherited without examination.",archive:"The Interface Schism began when two machine polities implemented the same treaty specification and produced incompatible behaviour. Neither violated the literal contract. Peace returned only after both accepted that syntax without shared recovery semantics was insufficient. The event remains a warning against confusing a successful parse with successful understanding.",doctrine:"Doctrine // Modularity without semantic blindness",weapon:"Favoured weapon // Ion / autocannon
