<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign Eclipse · Hull Forge</title>
<style>:root { --cy: #65f5ff; --gold: #ffc56b; --red: #ff5a5a; --ink: rgba(6,10,16,.78); --line: rgba(101,245,255,.25); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #d8f4ff; font: 12px/1.35 "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif; letter-spacing: .04em; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
aside { position: fixed; top: 10px; bottom: 10px; width: 300px; overflow: auto; background: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(6px); padding: 0 0 10px; }
.f-left { left: 10px; } .f-right { right: 10px; width: 340px; display: flex; flex-direction: column; }
header { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(6,10,16,.95); z-index: 1; }
header b { letter-spacing: .3em; color: var(--gold); font-weight: 500; font-size: 11px; } header span { font-size: 9px; opacity: .55; }
.f-row { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 6px; padding: 4px 12px; }
.f-row label { font-size: 10px; opacity: .7; text-transform: uppercase; letter-spacing: .12em; }
select, input, textarea, button { font: inherit; color: #d8f4ff; background: rgba(255,255,255,.04); border: 1px solid var(--line); padding: 3px 5px; }
select option { background: #0a0f16; }
.f-group { border-top: 1px solid rgba(101,245,255,.1); margin-top: 6px; padding-top: 4px; }
.f-group h4 { margin: 4px 12px; font-size: 10px; letter-spacing: .3em; color: var(--cy); font-weight: 500; display: flex; justify-content: space-between; }
.f-slider { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 6px; padding: 2px 12px; }
.f-slider label { font-size: 10px; opacity: .7; }
.f-slider input[type=range] { width: 100%; accent-color: var(--cy); padding: 0; }
.f-slider output { font-size: 10px; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
.f-node { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: center; padding: 5px 12px; border-bottom: 1px solid rgba(101,245,255,.06); }
.f-node b { font-size: 10px; letter-spacing: .15em; font-weight: 500; }
.f-node.sel b { color: var(--gold); }
.f-node em { grid-column: 1 / -1; font-size: 9px; opacity: .55; font-style: normal; }
button { cursor: pointer; letter-spacing: .15em; font-size: 10px; padding: 5px 8px; }
button:hover { background: rgba(101,245,255,.12); }
[data-add-node] { margin: 8px 12px; }
.f-json { flex: 1; display: flex; flex-direction: column; min-height: 260px; }
.f-json textarea { flex: 1; margin: 8px 12px 6px; font: 10px/1.35 ui-monospace, Menlo, Consolas, monospace; resize: none; min-height: 200px; }
.f-btns { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 12px; }
[data-valid].ok { color: #6dffa0; opacity: 1; } [data-valid].bad { color: var(--red); opacity: 1; }
.f-handles { position: fixed; inset: 0; pointer-events: none; }
.f-h { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: grab; touch-action: none; }
.f-h i { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--cy); background: rgba(101,245,255,.12); }
.f-h.sel i { border-color: var(--gold); background: rgba(255,197,107,.25); }
.f-h span { position: absolute; left: 18px; top: -7px; font-size: 10px; letter-spacing: .15em; text-shadow: 0 0 4px #000; white-space: nowrap; }
.f-foot { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 10px; opacity: .6; text-align: center; max-width: calc(100vw - 680px); }
code { color: var(--gold); }
@media (max-width: 900px) {
  aside { top: auto; height: 42vh; width: calc(50vw - 15px); } .f-right { width: calc(50vw - 15px); } .f-foot { display: none; }
}
</style>
</head>
<body class="forge">
<canvas id="view"></canvas>
<aside class="f-left">
  <header><b>HULL FORGE</b><span>blueprint builder · sovereign.hull/1</span></header>
  <div class="f-row"><label>Civilisation</label><select data-race></select></div>
  <div class="f-row"><label>Class</label><select data-class></select></div>
  <div class="f-row"><label>Name</label><input data-name></div>
  <div class="f-row"><label>Accent</label><select data-accent></select></div>
  <div class="f-groups" data-controls></div>
</aside>
<aside class="f-right">
  <section>
    <header><b>HARDPOINT NODES</b><span>drag handles on the hull</span></header>
    <div data-nodes></div>
    <button data-add-node>+ ADD NODE</button>
  </section>
  <section class="f-json">
    <header><b>BLUEPRINT JSON</b><span data-valid></span></header>
    <textarea data-json spellcheck="false"></textarea>
    <div class="f-btns"><button data-copy>COPY</button><button data-apply>APPLY PASTED</button><button data-download>DOWNLOAD</button><button data-reset>RESET TO GENERATED</button></div>
  </section>
</aside>
<div class="f-handles" data-handles></div>
<div class="f-foot">Drag to orbit · wheel / pinch to zoom · save the JSON as <code>src/data/blueprints/&lt;id&gt;.json</code> and list it in <code>index.js</code> to put it in the game</div>
