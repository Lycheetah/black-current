<text x="976" y="430" fill="#8cb9e5" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="976" y="464" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">3. Give space and ships</text>
<text x="976" y="494" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">identity</text>
<text x="976" y="532" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Distinct systems, coherent ship art, useful</text>
<text x="976" y="554" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">stations and meaningful roles</text>
<text x="976" y="588" fill="#8cb9e5" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="976" y="610" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Continue selected-art integration, authored encounters</text>
<text x="976" y="629" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">and clear travel. Decide five versus eight hull paths</text>
<text x="976" y="648" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">before implementing specialisations. Preserve room for</text>
<text x="976" y="667" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">player designs.</text>
