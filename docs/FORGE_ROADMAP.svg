<text x="528" y="430" fill="#e6bd76" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="528" y="464" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">2. Make the opening</text>
<text x="528" y="494" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">rewarding</text>
<text x="528" y="532" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Useful first upgrades, clear hull goals and</text>
<text x="528" y="554" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">readable fights</text>
<text x="528" y="588" fill="#e6bd76" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="528" y="610" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Time the first 15 minutes; an earned fitting within</text>
<text x="528" y="629" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">five minutes is a target. Tune income, loot and</text>
<text x="528" y="648" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">deaths. Phone FPS goals of 45–60 ordinary / 30 busy</text>
<text x="528" y="667" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Medium remain unverified.</text>
