<text x="80" y="778" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">4. Prototype private co-op</text>
<text x="80" y="816" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Two pilots join one arena with a short room</text>
<text x="80" y="838" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">code</text>
<text x="80" y="902" fill="#bd9ae3" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="80" y="924" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Prove two-player simulation, shared enemies,</text>
<text x="80" y="943" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">authoritative rewards and reconnects. No room service</text>
<text x="80" y="962" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">exists; persistent co-op rewards wait for save-safety</text>
<text x="80" y="981" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">checks.</text>
<rect x="508" y="710" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="508" y="710" width="424" height="5" rx="2" fill="#8ccbb3"/>
<text x="528" y="744" fill="#8ccbb3" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="528" y="778" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">5. Deepen the RPG world</text>
<text x="528" y="816" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Named NPC jobs, exploration sites,</text>
<text x="528" y="838" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">companions and targeted equipment</text>
<text x="528" y="902" fill="#8ccbb3" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="528" y="924" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Each activity has a readable goal, counterplay and</text>
<text x="528" y="943" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">useful reward. Improve existing quests and augments</text>
<text x="528" y="962" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">before adding mandatory systems. Expand co-op travel</text>
<text x="528" y="981" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">only after the arena prototype works.</text>
<rect x="956" y="710" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="956" y="710" width="424" height="5" rx="2" fill="#e0a475"/>
<text x="976" y="744" fill="#e0a475" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="976" y="778" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">6. Earn the capital endgame</text>
<text x="976" y="816" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Roaming warlords, anomalies, distinct bosses</text>
<text x="976" y="838" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">and major ship investments</text>
<text x="976" y="902" fill="#e0a475" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="976" y="924" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Capital fights must offer tactics and specific</text>
<text x="976" y="943" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">rewards. Add replay value and faction build paths</text>
<text x="976" y="962" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">without making difficulty only larger HP pools.</text>
<text x="60" y="1080" fill="#c8a6ef" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700">CO-OP FIRST SLICE</text>
<text x="60" y="1110" fill="#c8d9df" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">Create room → share code → ready together → one arena → personal rewards → safe return</text>
<text x="60" y="1141" fill="#73949f" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="400">Source: docs/PLAN.md · sequence, not delivery dates · 73aa0b898cd6</text>
