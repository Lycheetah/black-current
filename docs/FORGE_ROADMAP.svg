<text x="60" y="152" fill="#9dded0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Map and places → dungeons → campaign → ship identity → co-op → ready for players</text>
<rect x="60" y="182" width="1320" height="180" rx="12" fill="#163337" stroke="#a18a55"/>
<text x="84" y="215" fill="#f0cb7d" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">NOW · STAGE 2 OF THE MASTER ROUTE</text>
<text x="84" y="254" fill="#f4e8c9" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700">2. Dungeons</text>
<text x="84" y="286" fill="#c8e0dc" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Derelict dives and rifts with their own loot</text>
<text x="84" y="325" fill="#9fbdbd" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Dock with a giant wreck and fly a chain of themed rooms to a boss. Timed rifts with run modifiers. Dungeon-only named uniques and set pieces.</text>
