<text x="60" y="52" fill="#8acbc5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700">LYCHEETAH / BLACK CURRENT</text>
<text x="60" y="112" fill="#f0e3bf" font-family="DejaVu Sans,sans-serif" font-size="48" font-weight="700">ROUTE 2 · THE LIVING CURRENT</text>
<text x="60" y="152" fill="#9dded0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Ship and steady → wingmen → life in space → ship identity → bases → co-op → ready for players</text>
