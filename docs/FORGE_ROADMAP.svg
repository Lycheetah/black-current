<text x="976" y="778" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">7. Weapons with jobs</text>
<text x="976" y="816" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Choosing a gun matters</text>
<text x="976" y="902" fill="#e0a475" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">DONE WHEN</text>
<text x="976" y="924" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Damage layers against shields/armour/swarms, enemy</text>
<text x="976" y="943" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">profiles, traits on recovered guns</text>
<rect x="60" y="1024" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="60" y="1024" width="424" height="5" rx="2" fill="#8cd7c8"/>
<text x="80" y="1058" fill="#8cd7c8" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="80" y="1092" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">8. Home system</text>
<text x="80" y="1130" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Your elite base</text>
<text x="80" y="1216" fill="#8cd7c8" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">DONE WHEN</text>
<text x="80" y="1238" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Claim and build up a whole system: stations, defences,</text>
<text x="80" y="1257" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">a shipyard, raids to repel; later, conquest of more</text>
<rect x="508" y="1024" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="508" y="1024" width="424" height="5" rx="2" fill="#e6bd76"/>
<text x="528" y="1058" fill="#e6bd76" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="528" y="1092" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">9. Ally → co-op</text>
<text x="528" y="1130" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">A friend in the fight</text>
<text x="528" y="1216" fill="#e6bd76" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">DONE WHEN</text>
<text x="528" y="1238" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">AI escort roles first; private two-player room later</text>
<text x="528" y="1257" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">(see co-op proposal)</text>
<rect x="956" y="1024" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="956" y="1024" width="424" height="5" rx="2" fill="#8cb9e5"/>
<text x="976" y="1058" fill="#8cb9e5" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="976" y="1092" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">10. Capital endgame</text>
<text x="976" y="1130" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Titan fleets and citadels</text>
<text x="976" y="1216" fill="#8cb9e5" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">DONE WHEN</text>
<text x="976" y="1238" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Authored shields, batteries, hangars and cores with</text>
<text x="976" y="1257" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">specific rewards</text>
<text x="60" y="1362" fill="#c8a6ef" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700">CO-OP FIRST SLICE</text>
<text x="60" y="1392" fill="#c8d9df" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">Create room → share code → ready together → one arena → personal rewards → safe return</text>
