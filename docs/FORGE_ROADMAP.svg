<text x="528" y="430" fill="#e6bd76" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">IN REVIEW · MAC TO PLAY</text>
<text x="528" y="464" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">1. Map and places</text>
<text x="528" y="502" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Zones sized for your ship, places you</text>
<text x="528" y="524" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">remember, a real map, a sound mix</text>
<text x="528" y="588" fill="#e6bd76" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="528" y="610" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Sectors scale with your frame (a titan has room).</text>
<text x="528" y="629" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Phone lens keeps your ship readable zoomed out.</text>
<text x="528" y="648" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Zoomable galaxy map with landmarks and routes. Every</text>
<text x="528" y="667" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">sector has terrain and a landmark; biomes play…</text>
<rect x="956" y="396" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="956" y="396" width="424" height="5" rx="2" fill="#8cb9e5"/>
<text x="976" y="430" fill="#8cb9e5" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">NEXT</text>
<text x="976" y="464" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">3. Campaign</text>
<text x="976" y="502" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">A story spine through the places</text>
<text x="976" y="588" fill="#8cb9e5" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="976" y="610" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Three acts with recurring named characters, set-piece</text>
<text x="976" y="629" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">missions, jobs and reputation per civilisation, and a</text>
<text x="976" y="648" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">clear next step at all times.</text>
<rect x="60" y="710" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="60" y="710" width="424" height="5" rx="2" fill="#bd9ae3"/>
<text x="80" y="744" fill="#bd9ae3" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="80" y="778" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">4. Ship identity</text>
<text x="80" y="816" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Five hull paths, signatures, gun mods</text>
<text x="80" y="902" fill="#bd9ae3" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="80" y="924" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Interceptor, assault, logistics, carrier and siege per</text>
<text x="80" y="943" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">frame. Civilisation signature gear and liveries. Gun</text>
<text x="80" y="962" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">mod slots. Wingmen from saved designs.</text>
<rect x="508" y="710" width="424" height="290" rx="10" fill="#10232d" stroke="#35535d"/><rect x="508" y="710" width="424" height="5" rx="2" fill="#8ccbb3"/>
<text x="528" y="744" fill="#8ccbb3" font-family="DejaVu Sans,sans-serif" font-size="11" font-weight="700">QUEUED</text>
<text x="528" y="778" fill="#e3e9e1" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400">5. Co-op</text>
<text x="528" y="816" fill="#bad1d5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Friends in the dives</text>
<text x="528" y="902" fill="#8ccbb3" font-family="DejaVu Sans,sans-serif" font-size="10" font-weight="700">PROOF BEFORE MOVING ON</text>
<text x="528" y="924" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Room code → peer-to-peer WebRTC, the host&#x27;s browser</text>
<text x="528" y="943" fill="#8eabb4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">runs the game. Two players run derelict dives and</text>
